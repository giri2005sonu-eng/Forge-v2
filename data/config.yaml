# Robot types supported in Layer 1 (narrow scope on purpose)
robot_types:
  line_follower:
    label: "Line follower"
    categories: [controller, driver, motor, battery, sensor, chassis]
    sensor_kind: line
    default_sensor_channels: 5
  obstacle_avoider:
    label: "Obstacle avoider"
    categories: [controller, driver, motor, battery, sensor, chassis]
    sensor_kind: distance
    default_sensor_channels: 1

# Assumptions used by derived values (shown to the user, edit freely)
assumptions:
  avg_load_fraction: 0.4        # average motor current = 40% of stall current
  battery_usable_fraction: 0.8  # only 80% of rated battery capacity is usable

# Shipping estimate per vendor order (ASSUMPTION - edit per vendor if you know real rates)
shipping:
  default_flat_inr: 70
  per_vendor:
    robu.in:
      flat_inr: 70
      free_above_inr: 999
    robocraze.com:
      flat_inr: 70
      free_above_inr: 999

# Vendors preferred when picking pages from TinyFish search results (editable)
allowed_vendor_domains:
  - robu.in
  - robocraze.com
  - quartzcomponents.com
  - thinkrobotics.com
  - probots.co.in
  - electronicscomp.com
  - evelta.com
  - amazon.in
