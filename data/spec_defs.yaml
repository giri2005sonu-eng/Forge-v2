# Allowed spec keys per category: type, unit, plausible range (used to reject bad extractions)
controller:
  logic_voltage_v:  {type: number, unit: V,    min: 1.0,  max: 6.0,  desc: "GPIO logic level (5 for Arduino Uno/Nano, 3.3 for ESP32)"}
  vin_min_v:        {type: number, unit: V,    min: 2.0,  max: 30,   desc: "Minimum recommended voltage on the VIN / raw power input"}
  vin_max_v:        {type: number, unit: V,    min: 3.0,  max: 40,   desc: "Maximum recommended voltage on the VIN / raw power input"}
  digital_io_pins:  {type: number, unit: pins, min: 2,    max: 120,  desc: "Pins usable as digital I/O (count analog pins that can act as digital)"}
  pwm_pins:         {type: number, unit: pins, min: 0,    max: 64,   desc: "Number of PWM-capable pins"}
  current_a:        {type: number, unit: A,    min: 0.001, max: 2.0, desc: "Typical or peak supply current drawn by the board"}
  bluetooth:        {type: bool,   unit: null,                        desc: "Has built-in Bluetooth"}
driver:
  motor_supply_min_v:        {type: number, unit: V,    min: 1.0, max: 30,  desc: "Minimum motor supply voltage (VM / VS)"}
  motor_supply_max_v:        {type: number, unit: V,    min: 3.0, max: 60,  desc: "Maximum motor supply voltage (VM / VS)"}
  voltage_drop_v:            {type: number, unit: V,    min: 0.0, max: 5.0, desc: "Total voltage lost across the H-bridge at about 1 A"}
  max_continuous_current_a:  {type: number, unit: A,    min: 0.2, max: 20,  desc: "Max continuous current PER CHANNEL"}
  channels:                  {type: number, unit: ch,   min: 1,   max: 4,   desc: "Number of motor channels"}
  logic_high_min_v:          {type: number, unit: V,    min: 0.5, max: 5.0, desc: "Minimum input voltage recognised as logic HIGH"}
  logic_input_max_v:         {type: number, unit: V,    min: 1.8, max: 12,  desc: "Maximum recommended logic input voltage"}
  control_pins_per_motor:    {type: number, unit: pins, min: 1,   max: 4,   desc: "Controller pins needed per motor (direction + PWM)"}
  pwm_pins_per_motor:        {type: number, unit: pins, min: 0,   max: 2,   desc: "Of those, how many must be PWM-capable"}
  extra_pins:                {type: number, unit: pins, min: 0,   max: 4,   desc: "Shared control pins (e.g. standby)"}
motor:
  motor_type:         {type: string, unit: null, desc: "Form factor family, e.g. N20 or TT"}
  min_voltage_v:      {type: number, unit: V, min: 0.5, max: 30, desc: "Minimum operating voltage"}
  max_voltage_v:      {type: number, unit: V, min: 1.5, max: 48, desc: "Maximum operating voltage"}
  stall_current_a:    {type: number, unit: A, min: 0.05, max: 20, desc: "Stall current at rated voltage"}
battery:
  nominal_v:                {type: number, unit: V,   min: 1.0, max: 30,  desc: "Nominal pack voltage"}
  max_v:                    {type: number, unit: V,   min: 1.0, max: 36,  desc: "Fully charged pack voltage"}
  capacity_mah:             {type: number, unit: mAh, min: 100, max: 50000, desc: "Rated capacity"}
  max_discharge_current_a:  {type: number, unit: A,   min: 0.1, max: 100, desc: "Max continuous discharge current of the pack"}
sensor:
  channels:        {type: number, unit: ch,   min: 1,   max: 16,  desc: "Sensing channels per unit"}
  signal_pins:     {type: number, unit: pins, min: 1,   max: 16,  desc: "Controller pins needed per unit"}
  min_supply_v:    {type: number, unit: V,    min: 1.0, max: 12,  desc: "Minimum supply voltage"}
  max_supply_v:    {type: number, unit: V,    min: 1.8, max: 24,  desc: "Maximum supply voltage"}
  current_a:       {type: number, unit: A,    min: 0.0005, max: 1.0, desc: "Supply current per unit"}
chassis:
  motor_type:      {type: string, unit: null, desc: "Motor family the chassis mounts, e.g. N20 or TT"}
